[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telos"
version = "0.1.0"
description = "A framework for evaluating and back-propagating through linear temporal logic traces, in pytorch."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Konstantinos Kogkalidis" }
]
keywords = ["linear temporal logic", "fuzzy logic", "differentiable logic", "pytorch", "neurosymbolic"]
dependencies = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/konstantinosKokos/telos"
Repository = "https://github.com/konstantinosKokos/telos"
Issues = "https://github.com/konstantinosKokos/telos/issues"

[project.optional-dependencies]
test = ["pytest", "hypothesis", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]
